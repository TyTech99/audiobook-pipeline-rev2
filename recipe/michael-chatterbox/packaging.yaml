# Packaging configuration for Michael Chatterbox recipe

formats:
  m4b:
    container: "mp4"
    brand: "M4B "
    stik: 2                    # Audiobook flag
    codec: "aac"
    bitrate: "96k"
    sample_rate: 44100
    channels: 1
    chapters:
      style: "quicktime"       # QuickTime chapter markers
      read_header: false       # Don't read chapter titles aloud
    cover_art:
      embed: true
      format: "jpeg"
      max_size: 1400
    metadata:
      title: "{{ title }}"
      artist: "{{ author }}"
      album_artist: "Michael (Chatterbox)"
      genre: "Audiobook"
      composer: "Chatterbox TTS"
      comment: "Generated by audiobook-pipeline"

  mp3:
    codec: "mp3"
    bitrate: "192k"
    cbr: true
    sample_rate: 44100
    channels: 1
    chapters:
      separate_files: true     # chapter-001.mp3, chapter-002.mp3, ...
      naming: "chapter-NNN.mp3"
    extras:
      opening_credits: "mp3/opening-credits.mp3"
      closing_credits: "mp3/closing-credits.mp3"
      retail_sample:
        path: "mp3/retail-sample.mp3"
        duration_seconds: 75   # ~1-5 min range, ACX requirement

output_layout:
  m4b: "m4b/audiobook.m4b"
  mp3_dir: "mp3/"
  metadata: "metadata.json"
  qc_report: "qc-report.json"
