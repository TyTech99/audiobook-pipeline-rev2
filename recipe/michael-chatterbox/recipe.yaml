name: "michael-chatterbox"
version: "1.0.0"
stack: "chatterbox"

description: >
  Michael voice clone using Chatterbox TTS (ResembleAI).
  Voice sample: voices/Michael.wav.
  LLM annotation is optional (enabled when LLM_BASE_URL and LLM_MODEL are set).

min_hardware:
  gpu: false          # Works on CPU, but GPU is strongly preferred
  vram_gb: 8          # Recommended if GPU is available
  ram_gb: 16
  disk_gb: 20         # Includes HF model download (~2GB)

model:
  source: "huggingface"
  repo: "ResembleAI/chatterbox"
  revision: "main"
  files:
    - "ve.safetensors"
    - "t3_cfg.safetensors"
    - "s3gen.safetensors"
    - "tokenizer.json"
    - "conds.pt"
  note: "Downloaded automatically on first run via ChatterboxTTS.from_pretrained()"

engine:
  capabilities: "engine/capabilities.yaml"
  markup_examples: "engine/markup-examples.md"
  annotation_prompt: "engine/annotation-prompt.j2"
  chunk_size: "paragraph"

styles:
  - name: "neutral"
    description: "Even delivery, neutral tone, conversational register"
    prompt: "styles/neutral.j2"
  - name: "childrens-story"
    description: "Bright, energetic, playful tone, light mood"
    prompt: "styles/childrens-story.j2"
  - name: "noir-mystery"
    description: "Slow, gravelly, ominous tone, dark mood, elevated register"
    prompt: "styles/noir-mystery.j2"

tts:
  sample_rate: 24000      # Chatterbox native output
  bitrate: "192k"
  format: "mp3"
  chunk_size: 300         # Characters per TTS call
  voice: "voices/Michael.wav"

mastering:
  config: "mastering-chain.yaml"
  target_rms_db: -16.0    # LUFS integrated (ACX: -23 to -18)
  max_peak_db: -3.0
  max_noise_floor_db: -60

packaging:
  config: "packaging.yaml"
  formats:
    - type: "m4b"
      codec: "aac"
      bitrate: "96k"
      chapters:
        style: "quicktime"
        read_header: false
    - type: "mp3"
      codec: "mp3"
      bitrate: "192k"
      cbr: true
  metadata:
    narrator: "Michael (Chatterbox)"
  cover_art:
    required: false
    min_size: 600
    max_size: 1400
    format: "jpeg"

image:
  name: "audiobook-recipe-michael"
  tag: "local"
  dockerfile: "../../deploy/recipe-michael.Dockerfile"
