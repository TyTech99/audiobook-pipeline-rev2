# TTS Worker Configuration

worker:
  id: "${WORKER_ID}"
  node_id: "${NODE_ID}"
  type: "tts"

redis:
  host: "redis"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0

coordinator:
  url: "http://coordinator:8000/api/v1"
  api_key: "${API_KEY}"

s3:
  endpoint: "${S3_ENDPOINT}"
  bucket: "audiobook-pipeline"
  access_key: "${S3_ACCESS_KEY}"
  secret_key: "${S3_SECRET_KEY}"
  region: "us-east-1"

default_recipe_image: "${DEFAULT_RECIPE_IMAGE}"

storage:
  root: "${STORAGE_ROOT}"

# OpenAI-compatible LLM interface forwarded into the voice-recipe container
# for script annotation. Same schema as config/supervisor.yaml.
llm:
  base_url: "http://127.0.0.1:8080/v1"
  api_key: ""
  model: "local-model"
  timeout_seconds: 120
  slots: 4

queues:
  - "convert"

logging:
  level: "INFO"
  format: "json"
  file: "/var/log/worker-tts.log"
