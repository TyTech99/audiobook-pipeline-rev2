# Prep Worker Configuration

worker:
  id: "${WORKER_ID}"
  node_id: "${NODE_ID}"
  type: "prep"

redis:
  host: "redis"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0

coordinator:
  url: "http://coordinator:8000/api/v1"
  api_key: "${API_KEY}"

s3:
  endpoint: "${S3_ENDPOINT}"
  bucket: "audiobook-pipeline"
  access_key: "${S3_ACCESS_KEY}"
  secret_key: "${S3_SECRET_KEY}"
  region: "us-east-1"

storage:
  root: "${STORAGE_ROOT}"

# OpenAI-compatible LLM interface for book analysis (llm-analysis.json).
# Same schema as config/supervisor.yaml. On a node install the supervisor
# copy is the live source; this file is used when the prep worker runs
# directly and when the image is built. Values may be overridden by LLM_*
# env injected from supervisor.yaml at container start.
llm:
  base_url: "http://127.0.0.1:8080/v1"
  api_key: ""
  model: "local-model"
  timeout_seconds: 120
  slots: 4
  # Fail the prep job when base_url/model are missing or the call errors.
  required: true

queues:
  - "prep"

processing:
  max_concurrent_jobs: 1
  progress_interval_pages: 10
  temp_dir: "/tmp/prep"

pdf:
  max_pages: 5000
  text_extraction: "pymupdf"
  image_dpi: 300

epub:
  max_files: 1000
  preserve_images: true

validation:
  page_parity: true
  epub_valid: true
  script_valid: true

logging:
  level: "INFO"
  format: "json"
  file: "/var/log/worker-prep.log"
