# Prep Worker Configuration

worker:
  id: "${WORKER_ID}"
  node_id: "${NODE_ID}"
  type: "prep"

redis:
  host: "127.0.0.1"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0

coordinator:
  url: "http://coordinator:8000/api/v1"
  api_key: "${API_KEY}"

s3:
  endpoint: "${S3_ENDPOINT}"
  bucket: "audiobook-pipeline"
  access_key: "${S3_ACCESS_KEY}"
  secret_key: "${S3_SECRET_KEY}"
  region: "us-east-1"

storage:
  root: "${STORAGE_ROOT}"

# OpenAI-compatible LLM interface for book analysis (llm-analysis.json).
# Same schema as config/supervisor.yaml. On a node install the supervisor
# copy is the live source; this file is used when the prep worker runs
# directly and when the image is built. Values may be overridden by LLM_*
# env injected from supervisor.yaml at container start.
llm:
  base_url: "http://127.0.0.1:8081/v1"
  api_key: ""
  model: "local-model"
  timeout_seconds: 120
  slots: 4
  # Fail the prep job when base_url/model are missing or the call errors.
  required: true

queues:
  - "prep"

processing:
  max_concurrent_jobs: 1
  progress_interval_pages: 10
  temp_dir: "/tmp/prep"

pdf:
  max_pages: 5000
  text_extraction: "pymupdf"
  image_dpi: 300

ocr:
  enabled: true
  dpi: 300
  language: "eng"
  # Quality thresholds — pages below these are flagged for LLM cleanup
  min_confidence: 85.0
  min_dict_share: 0.90
  min_chars: 10
  # LLM cleanup for low-quality OCR pages
  llm_cleanup:
    enabled: true
    temperature: 0.1
    max_tokens: 4096
    system_prompt: |
      You are an OCR text cleanup specialist. Your job is to fix OCR errors in extracted book text while preserving the original meaning and wording.

      Common OCR errors to fix:
      - Misrecognized characters (e.g., '1' instead of 'l', '0' instead of 'O', 'rn' instead of 'm')
      - Broken hyphens at line ends (rejoin words split across lines: "star-\nvation" → "starvation")
      - Random page breaks and headers/footers (remove page numbers, running titles, chapter headers repeated on each page)
      - Garbage characters and symbols that don't belong
      - Spacing errors (missing or extra spaces)

      Rules:
      - Preserve the original wording and meaning as much as possible
      - Do NOT add content that isn't in the original
      - Do NOT rewrite or paraphrase — only fix OCR artifacts
      - Return ONLY the cleaned text, no explanations or markdown

# Text normalization thresholds (post-OCR cleanup).
# These control header/footer detection, paragraph reconstruction, and
# hyphen repair. Tune per-book if the defaults don't match the layout.
# Per-job overrides: pass the same keys under metadata.normalization when
# submitting a job (e.g. {"metadata": {"normalization": {"indent_pt": 6.0}}}).
normalization:
  # Paragraph detection (geometric, in points)
  # A line starts a new paragraph if indented at least this much relative
  # to the previous line, or sits this much lower than normal line spacing.
  indent_pt: 4.5
  gap_pt: 2.5
  # Line spacing bounds (points). Gaps outside this range are column jumps.
  pitch_min_pt: 6.0
  pitch_max_pt: 40.0
  # Mid-sentence paragraph merging: min words before a break is treated
  # as mid-sentence (shorter lines are headings/titles).
  mid_sentence_min_words: 6
  # Running header detection
  # A line opening at least this many pages is a running header candidate.
  running_header_min_pages: 3
  # Max words in a running header line.
  running_header_max_words: 12
  # Title similarity (0-1) for header detection.
  header_title_similarity: 0.9

epub:
  max_files: 1000
  preserve_images: true

validation:
  page_parity: true
  epub_valid: true
  script_valid: true

logging:
  level: "INFO"
  format: "json"
  file: "/var/log/worker-prep.log"
