# Redis, PostgreSQL, and the coordinator.
# From the repo, `docker compose -f deploy/docker-compose.dev.yml up` uses this file.
# audiobookctl installs a copy whose build context is the coordinator prefix.
services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: audiobook
    ports:
      - "127.0.0.1:5432:5432"
  coordinator:
    build:
      context: ..
      dockerfile: deploy/coordinator.Dockerfile
    environment:
      COORDINATOR_ID: ${COORDINATOR_ID}
      API_KEY_OPERATOR: ${API_KEY_OPERATOR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      STORAGE_ROOT: /var/lib/audiobook
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/lib/audiobook:/var/lib/audiobook
    depends_on:
      - redis
      - postgres
